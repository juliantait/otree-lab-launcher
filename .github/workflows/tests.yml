name: tests

# Runs the committed tests/ suite on every push and pull request.
#
# The suites under tests/ are stdlib-only: the two core suites import only
# otree_core (a pure-stdlib module) and the Tk parity suite guards its
# otree_lab_launcher import with pytest.importorskip("tkinter"), so it runs
# where the runner's Python ships Tk and skips cleanly where it does not. That
# means the only dependency to install is pytest itself.
#
# Windows is in the matrix on purpose (review item #12): it is the only place
# that exercises otree_core.exclusive_file_lock's msvcrt branch and the
# _no_window_flags path, which nothing else here covers.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The core suites are stdlib-only; only the test runner is needed.
        run: python -m pip install --upgrade pytest

      - name: Run the tests
        run: python -m pytest tests/ -v
